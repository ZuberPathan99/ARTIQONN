<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>ARTIQONN inquiry form definition</title>
  </head>
  <body>
    <!-- Static definition makes every field detectable by Netlify Forms. -->
    <form
      name="inquiry"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="inquiry" />
      <input name="bot-field" /><input name="name" /><input
        type="email"
        name="email"
      /><input name="company" /><input name="service" /><textarea
        name="message"
      ></textarea>
    </form>
  </body>
</html>
